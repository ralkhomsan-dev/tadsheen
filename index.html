<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تدشين الدليل">
<meta name="theme-color" content="#33000f">
<title>تدشين دليل المشاريع الريادية بالجوف</title>
<style>
@font-face{font-family:Plex;font-weight:400;src:url(IBMPlexSansArabic-Regular.woff2)}
@font-face{font-family:Plex;font-weight:600;src:url(IBMPlexSansArabic-SemiBold.woff2)}
@font-face{font-family:Plex;font-weight:700;src:url(IBMPlexSansArabic-Bold.woff2)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;overscroll-behavior:none;touch-action:none;background:#2a000d;font-family:Plex,system-ui,sans-serif;color:#fff;cursor:default}
#bg{position:fixed;inset:0;background:radial-gradient(60% 70% at 62% 30%,#8f0a22 0%,#5a0018 45%,#33000f 100%)}
#bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:6vmin 6vmin;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vmin;transition:opacity .9s,transform 1.2s;z-index:2}
#logos{display:flex;align-items:center;gap:4vmin;height:13vmin}
#logos img{max-height:100%}#logos .ch{height:8.5vmin}#logos i{width:2px;height:9vmin;background:rgba(206,150,90,.55)}
h1{font-size:6.4vmin;font-weight:700;line-height:1.25;text-align:center}
h1 b{color:#CE965A}
#rule{width:34vmin;height:2px;background:linear-gradient(90deg,transparent,#CE965A,transparent)}
#fp{position:relative;width:30vmin;height:30vmin;margin-top:1vmin;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
#fp .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(206,150,90,.55);animation:pulse 2.6s ease-out infinite}
#fp .ring:nth-child(2){animation-delay:.85s}#fp .ring:nth-child(3){animation-delay:1.7s}
@keyframes pulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.45);opacity:0}}
#fp .disc{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 50% 35%,rgba(206,150,90,.22),rgba(206,150,90,.05));border:2px solid rgba(206,150,90,.8);box-shadow:0 0 6vmin rgba(206,150,90,.25),inset 0 0 4vmin rgba(206,150,90,.12);transition:box-shadow .3s,transform .3s}
#fp.on .disc{transform:scale(.96);box-shadow:0 0 10vmin rgba(206,150,90,.6),inset 0 0 6vmin rgba(206,150,90,.3)}
#fp svg{position:relative;width:52%;height:52%;overflow:visible}
#fp .dim{stroke:rgba(255,255,255,.38)}#fp .lit{stroke:#F2C078;filter:drop-shadow(0 0 1.2vmin rgba(242,192,120,.9))}
#scan{position:absolute;left:18%;right:18%;height:3px;top:76%;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 2vmin #F2C078;opacity:0}
#hint{font-size:3vmin;font-weight:600;color:#E9C9A0;letter-spacing:.02em;animation:blink 2.2s ease-in-out infinite;min-height:4.5vmin}
@keyframes blink{50%{opacity:.45}}
#pct{position:absolute;bottom:-1.5vmin;font-size:2.4vmin;font-weight:700;color:#F2C078;opacity:0;direction:ltr}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,#F2C078 35%,rgba(206,150,90,0) 70%);opacity:0;pointer-events:none;z-index:5;transform:scale(.2)}
#flash.go{animation:flash 1.3s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:scale(3.2)}}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity 1s;z-index:3;pointer-events:none}
body.play #stage{opacity:0;transform:scale(1.15);pointer-events:none}
body.play video{opacity:1}
body.play{cursor:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#ok{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;opacity:0;pointer-events:none;transition:opacity .5s}
#ok.show{opacity:1}
#ok>svg{width:20vmin;height:20vmin}
#ok>svg circle{stroke:#F2C078;stroke-width:4;fill:rgba(206,150,90,.12);stroke-dasharray:290;stroke-dashoffset:290}
#ok path{stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:70;stroke-dashoffset:70}
#ok.show>svg circle{animation:draw .7s ease-out forwards}#ok.show path{animation:draw .45s .55s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#ok h2{font-size:7vmin;font-weight:700}#ok h2 b{color:#CE965A}
#ok.count>svg{display:none}
#cw{position:relative;width:54vmin;height:54vmin;display:none;align-items:center;justify-content:center}
#ok.count #cw{display:flex}
#cw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
#cw .tr{fill:none;stroke:rgba(206,150,90,.22);stroke-width:2}
#cw .pr{fill:none;stroke:#F2C078;stroke-width:4;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:0;filter:drop-shadow(0 0 1.5vmin rgba(242,192,120,.9))}
#cw .pr.run{animation:ring .85s linear forwards}
@keyframes ring{from{stroke-dashoffset:0}to{stroke-dashoffset:339.3}}
#cw .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #F2C078;opacity:0}
#cw .rp.run{animation:rp .85s ease-out}
@keyframes rp{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
#cnt{position:relative;font-size:36vmin;font-weight:700;line-height:1;direction:ltr;background:linear-gradient(180deg,#fff 10%,#F2C078 55%,#CE965A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 3vmin rgba(242,192,120,.55))}
#cnt.pop{animation:pop .85s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(1.8);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
body.ok #stage{opacity:0;transform:scale(.9);pointer-events:none}
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage">
  <div id="logos"><img class="ch" src="logo-chamber.png" alt=""><i></i><img src="logo-forum.png" alt=""></div>
  <h1>تدشين دليل المشاريع الريادية <b>بالجوف</b></h1>
  <div id="rule"></div>
  <div id="fp" role="button" aria-label="بصمة التدشين">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="disc"></div>
    <svg viewBox="0 0 100 120" fill="none" stroke-width="3.4" stroke-linecap="round">
      <defs><clipPath id="clip"><rect id="clipR" x="-10" y="130" width="120" height="140"/></clipPath>
      <g id="prints">
        <path d="M50 58v22"/><path d="M40 84c1-8 1-16 1-25a9 9 0 0 1 18 0c0 14-1 26-5 38"/>
        <path d="M30 92c2-10 2-20 2-33a18 18 0 0 1 36 0c0 9 0 17-1 24"/><path d="M64 96c-1 6-3 11-5 16"/>
        <path d="M21 82c1-7 2-14 2-23a27 27 0 0 1 54 0c0 14-1 27-4 39"/><path d="M24 100c-1 3-2 6-3 8"/>
        <path d="M13 70c1-4 1-7 1-11a36 36 0 0 1 61-26"/><path d="M82 44a36 36 0 0 1 4 15c0 8 0 16-1 24"/>
        <path d="M47 100c-1 6-3 12-6 17"/><path d="M26 20a45 45 0 0 1 48 0"/>
      </g></defs>
      <use href="#prints" class="dim"/><use href="#prints" class="lit" clip-path="url(#clip)"/>
    </svg>
    <div id="scan"></div><div id="pct">0%</div>
  </div>
  <div id="hint">ضع بصمتك لتدشين الدليل</div>
</div>
<canvas id="fx"></canvas>
<div id="ok"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M30 52l14 14 27-30"/></svg><h2>تم <b>التدشين</b></h2><div id="cw"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle class="pr" id="pr" cx="60" cy="60" r="54"/></svg><i class="rp"></i><div id="cnt"></div></div></div>
<div id="flash"></div>
<video id="v" src="video.mp4" preload="auto" playsinline webkit-playsinline disablepictureinpicture x-webkit-airplay="deny"></video>
<script>
/* ===== إعدادات يمكن تعديلها ===== */
const HOLD_SECONDS = 2.5;      // مدة مسح البصمة قبل انطلاق الفيديو
const NEED_HOLD   = false;     // true = يلزم إبقاء الإصبع حتى يكتمل المسح، false = لمسة واحدة تكفي
/* ================================ */
const fp=document.getElementById('fp'),clipR=document.getElementById('clipR'),scan=document.getElementById('scan'),
      pct=document.getElementById('pct'),hint=document.getElementById('hint'),v=document.getElementById('v'),flash=document.getElementById('flash');
let prog=0,active=false,done=false,last=0,ac,osc,gain,unlocked=false,waiting=false;
function fs(){const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(f&&!(document.fullscreenElement||document.webkitFullscreenElement)){try{const r=f.call(d);if(r&&r.catch)r.catch(()=>{});}catch(e){}}}
const TOUCH=(navigator.maxTouchPoints||0)>0;
function audioOn(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}
  try{if(!window.__sil){const n=4000,b=new Uint8Array(44+n),d=new DataView(b.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i);};w(0,'RIFF');d.setUint32(4,36+n,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,'data');d.setUint32(40,n,true);b.fill(128,44);
    const a=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));a.loop=true;a.setAttribute('playsinline','');const p=a.play();if(p&&p.catch)p.catch(()=>{});window.__sil=a;}}catch(e){}}
function unlock(){audioOn();if(unlocked)return;unlocked=true;try{v.muted=true;const r=v.play();if(r&&r.catch)r.catch(()=>{});}catch(e){}if(!TOUCH)fs();if(waiting){waiting=false;launch();}}
function tone(on){try{
  if(on){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();osc=ac.createOscillator();gain=ac.createGain();osc.type='sine';osc.frequency.value=220;gain.gain.value=0;gain.gain.linearRampToValueAtTime(.1,ac.currentTime+.2);osc.connect(gain).connect(ac.destination);osc.start();}
  else if(osc){gain.gain.linearRampToValueAtTime(0,ac.currentTime+.25);osc.stop(ac.currentTime+.3);osc=null;}
}catch(e){}}
function start(e){if(e)e.preventDefault();if(done||active)return;active=true;fp.classList.add('on');hint.textContent='جارٍ التحقق من البصمة...';hint.style.animation='none';scan.style.opacity=1;pct.style.opacity=1;tone(true);
  last=performance.now();requestAnimationFrame(tick);}
function stop(){if(!NEED_HOLD||done)return;active=false;fp.classList.remove('on');tone(false);hint.textContent='ضع بصمتك لتدشين الدليل';}
function tick(now){const dt=(now-last)/1000;last=now;
  if(active)prog=Math.min(1,prog+dt/HOLD_SECONDS);else prog=Math.max(0,prog-dt/.6);
  clipR.setAttribute('y',130-prog*140);scan.style.top=(76-prog*52)+'%';pct.textContent=Math.round(prog*100)+'%';
  if(osc)osc.frequency.value=220+prog*660;
  if(prog>=1&&!done){if(unlocked){launch();}else{waiting=true;hint.textContent='ارفع إصبعك لبدء العرض';}return;}
  if(prog>0||active)requestAnimationFrame(tick);else{scan.style.opacity=0;pct.style.opacity=0;}}
const okEl=document.getElementById('ok'),cnt=document.getElementById('cnt'),fx=document.getElementById('fx');let timer;
const pr=document.getElementById('pr'),rp=document.querySelector('#cw .rp');
function beep(n){try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.value=n===1?880:660;g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.3);}catch(e){}}
function launchSfx(){try{const t=ac.currentTime,D=ac.destination;
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(1400,t+.5);f.type='lowpass';f.frequency.value=2500;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.45);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(f).connect(g).connect(D);o.start(t);o.stop(t+.65);
  const b=ac.createOscillator(),bg=ac.createGain();b.frequency.setValueAtTime(140,t+.5);b.frequency.exponentialRampToValueAtTime(38,t+1.3);bg.gain.setValueAtTime(.55,t+.5);bg.gain.exponentialRampToValueAtTime(.0001,t+1.5);b.connect(bg).connect(D);b.start(t+.5);b.stop(t+1.6);
  [523,784,1047,1568].forEach(q=>{const c=ac.createOscillator(),cg=ac.createGain();c.frequency.value=q;cg.gain.setValueAtTime(.0001,t+.5);cg.gain.exponentialRampToValueAtTime(.08,t+.54);cg.gain.exponentialRampToValueAtTime(.0001,t+1.7);c.connect(cg).connect(D);c.start(t+.5);c.stop(t+1.8);});}catch(e){}}
function chime(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.13;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1);});}catch(e){}}
function burst(){const c=fx.getContext('2d'),W=fx.width=innerWidth,H=fx.height=innerHeight,cols=['#F2C078','#CE965A','#fff','#E9C9A0'],ps=[];for(let i=0;i<160;i++){const a=Math.random()*6.283,s=4+Math.random()*13;ps.push({x:W/2,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:4+Math.random()*9,c:cols[i%4],l:1,w:Math.random()*6.283});}
  (function f(){c.clearRect(0,0,W,H);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.985;p.l-=.008;p.w+=.2;if(p.l>0){alive=true;c.globalAlpha=p.l;c.fillStyle=p.c;c.fillRect(p.x,p.y,p.r*(1+Math.sin(p.w)*.5),p.r*1.6);}});c.globalAlpha=1;if(alive&&done)requestAnimationFrame(f);else c.clearRect(0,0,W,H);})();}
function launch(){if(done)return;done=true;tone(false);scan.style.opacity=0;document.body.classList.add('ok');okEl.classList.add('show');chime();burst();
  let n=3;const step=()=>{if(!done)return;if(n>0){okEl.classList.add('count');cnt.textContent=n;[cnt,pr,rp].forEach(e=>e.classList.remove('pop','run'));void cnt.offsetWidth;cnt.classList.add('pop');pr.classList.add('run');rp.classList.add('run');beep(n);n--;timer=setTimeout(step,850);}else{okEl.classList.remove('show');flash.classList.add('go');launchSfx();timer=setTimeout(reveal,550);}};
  timer=setTimeout(step,1300);}
function reveal(){document.body.classList.add('play');try{v.currentTime=0;}catch(e){}v.muted=false;const r=v.play();if(r&&r.catch)r.catch(()=>{v.muted=true;v.play().catch(()=>{});});}
function reset(){clearTimeout(timer);document.body.classList.remove('ok');okEl.classList.remove('show','count');cnt.textContent='';waiting=false;unlocked=false;done=false;active=false;prog=0;v.pause();v.currentTime=0;document.body.classList.remove('play');flash.classList.remove('go');fp.classList.remove('on');
  clipR.setAttribute('y',130);pct.style.opacity=0;pct.textContent='0%';hint.textContent='ضع بصمتك لتدشين الدليل';hint.style.animation='';}
fp.addEventListener('pointerdown',start);
['pointerup','touchend','click'].forEach(n=>fp.addEventListener(n,unlock));
['gesturestart','gesturechange','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
v.addEventListener('pause',()=>{if(done&&!v.ended&&document.body.classList.contains('play'))setTimeout(()=>{if(v.paused&&!v.ended)v.play().catch(()=>{});},150);});
['pointerup','pointerleave','pointercancel'].forEach(n=>fp.addEventListener(n,stop));
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();start();unlock();}
  else if(e.key==='r'||e.key==='R'||e.key==='ق')reset();
  else if(e.key==='f'||e.key==='F'||e.key==='ب'){(document.fullscreenElement||document.webkitFullscreenElement)?(document.exitFullscreen||document.webkitExitFullscreen).call(document):fs();}
});
let taps=0,tt;document.addEventListener('pointerdown',e=>{if(e.clientX<90&&e.clientY<90){taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,900);if(taps>=3){taps=0;reset();}}});
addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
